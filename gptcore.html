<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#131314">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GPT CORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#131314;--surface:#1e1f20;--pill:#282a2c;--hover:#333538;--blue:#4c8df6;--purple:#9b72cb;--pink:#d96570;--muted:#c4c7c5;--dark:#8e918f;--line:rgba(63,63,70,.5);--line2:rgba(39,39,42,.9);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#09090b;color:#f4f4f5;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:active{transform:scale(.96)}
input,textarea,select{font:inherit;color:inherit}
.ai,.bub,.ai *,.bub *,input,textarea,.sel{-webkit-user-select:text;user-select:text}
.hidden{display:none!important}
svg{display:block}
.grad-t{background:linear-gradient(135deg,#4285f4 0%,#9b72cb 40%,#d96570 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

#app{position:relative;width:100%;height:100dvh;max-width:520px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:560px){#app{border-left:1px solid #27272a;border-right:1px solid #27272a}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + var(--sat)) 16px 8px;z-index:20;background:var(--bg)}
.ib{padding:10px;border-radius:999px;color:#d4d4d8;display:flex}
.ib:hover{background:var(--surface)}
.ib svg{width:24px;height:24px}
.pill{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid rgba(63,63,70,.4);padding:6px 14px;border-radius:999px;max-width:58%}
.pill span{font-size:12px;font-weight:600;color:#e4e4e7;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill svg{width:14px;height:14px;color:#a1a1aa;flex:none;transition:transform .2s}
.pill.on svg{transform:rotate(180deg)}
.avatar{width:32px;height:32px;border-radius:999px;padding:1.5px;background:linear-gradient(45deg,#3b82f6,#a855f7,#ec4899)}
.avatar div{width:100%;height:100%;border-radius:999px;background:#18181b;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}

/* main */
#main{flex:1;overflow-y:auto;padding:16px 20px 128px;display:flex;flex-direction:column;justify-content:space-between;position:relative;scrollbar-width:none}
#main::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}
#hero{margin:auto 0;padding:24px 0}
#hero svg{width:48px;height:48px;margin-bottom:16px}
#hero h1{margin:0 0 12px;font-size:30px;font-weight:400;letter-spacing:-.02em;color:#f4f4f5}
#hero h1 b{font-weight:500}
#hero p{margin:0;font-size:24px;line-height:1.3;color:var(--dark)}
#sugg{margin-top:auto;padding-top:16px}
.cap{font-size:11px;font-weight:600;color:var(--dark);letter-spacing:.06em;text-transform:uppercase;padding:0 4px}
.hs{display:flex;gap:10px;overflow-x:auto;padding:8px 20px 8px;margin:0 -20px;scrollbar-width:none}
.sc{flex:none;width:176px;height:112px;background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.sc:hover{background:var(--hover)}
.sc p{margin:0;font-size:12px;font-weight:500;color:#e4e4e7;line-height:1.4}
.sc i{width:32px;height:32px;border-radius:999px;background:rgba(39,39,42,.8);display:flex;align-items:center;justify-content:center}
.sc i svg{width:16px;height:16px}

/* chat */
#chat{display:flex;flex-direction:column;gap:24px;padding:8px 0 24px}
.u{display:flex;justify-content:flex-end}
.bub{background:var(--surface);border:1px solid var(--line);border-radius:16px 4px 16px 16px;padding:12px 16px;max-width:85%;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.bub .tag,.bub .thumbs{margin-bottom:6px;font-size:12px;color:var(--muted)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:10px}
.a{display:flex;gap:12px;align-items:flex-start}
.ico{width:28px;height:28px;flex:none;margin-top:2px}
.ico svg{width:24px;height:24px;margin:2px}
.ab{min-width:0;flex:1;font-size:14px;line-height:1.7;color:#e4e4e7;padding-top:2px}
.ab .txt>*:first-child{margin-top:0}
.txt p{margin:.55em 0}
.txt h2,.txt h3,.txt h4,.txt h5{margin:1em 0 .4em;font-weight:600;line-height:1.3}
.txt h2{font-size:18px}.txt h3{font-size:16px}.txt h4,.txt h5{font-size:14px}
.txt ul,.txt ol{margin:.5em 0;padding-left:1.4em}
.txt li{margin:.2em 0}
.txt a{color:var(--blue)}
.txt hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.txt blockquote{margin:.6em 0;padding:2px 12px;border-left:3px solid #52525b;color:var(--muted)}
.txt code{background:var(--pill);padding:1px 5px;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.code{margin:.7em 0;border-radius:14px;overflow:hidden;background:#0d0d0e;border:1px solid var(--line2)}
.code-h{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--surface);font-size:11px;color:var(--dark)}
.copy-btn{font-size:11px;color:var(--muted);padding:3px 8px;border-radius:999px;background:var(--pill)}
.code pre{margin:0;padding:12px;overflow-x:auto;font-size:12.5px;line-height:1.55}
.code pre code{background:none;padding:0;color:#e4e4e7}
.tbl{overflow-x:auto;margin:.7em 0}
.tbl table{border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.tbl th{background:var(--surface)}
.pulse{color:#a1a1aa;animation:pl 1.4s infinite ease-in-out}
@keyframes pl{50%{opacity:.4}}
.stat{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.stat span{align-self:flex-start;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
details.think{margin:0 0 8px;border:1px solid var(--line2);border-radius:12px;background:rgba(30,31,32,.6)}
details.think summary{cursor:pointer;padding:8px 12px;font-size:12px;color:var(--dark);list-style:none}
details.think summary::-webkit-details-marker{display:none}
details.think .tt{padding:0 12px 10px;font-size:12.5px;line-height:1.6;color:var(--dark);white-space:pre-wrap;max-height:240px;overflow-y:auto}
.srcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.srcs a{font-size:11px;color:var(--muted);text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err{color:#f87171}

/* composer */
.composer{position:absolute;left:0;right:0;bottom:0;padding:12px 12px calc(8px + var(--sab));background:linear-gradient(to top,var(--bg),rgba(19,19,20,.95) 70%,transparent);z-index:20}
#chips{display:flex;gap:8px;overflow-x:auto;padding:0 4px 8px;scrollbar-width:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 4px;font-size:12px;max-width:200px}
.chip img{width:32px;height:32px;border-radius:8px;object-fit:cover}
.chip em{font-style:normal;width:32px;height:32px;border-radius:8px;background:var(--pill);display:flex;align-items:center;justify-content:center}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{padding:4px;color:var(--dark);display:flex}
.chip svg{width:14px;height:14px}
.bar{display:flex;align-items:flex-end;gap:4px;background:var(--pill);border:1px solid var(--line);border-radius:28px;padding:8px 10px 8px 12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.bar>button{flex:none}
.rb{width:36px;height:36px;border-radius:999px;background:#27272a;color:#d4d4d8;display:flex;align-items:center;justify-content:center}
.rb:hover{background:#3f3f46}
.rb svg{width:20px;height:20px}
#inp{flex:1;min-width:0;background:none;border:0;outline:0;resize:none;font-size:16px;line-height:22px;padding:7px 8px;max-height:132px;color:#f4f4f5;font-weight:400}
#inp::placeholder{color:var(--dark)}
.acts{display:flex;align-items:center;gap:2px;flex:none}
.ab2{padding:8px;color:#a1a1aa;display:flex}
.ab2:hover{color:#e4e4e7}
.ab2 svg{width:20px;height:20px}
.send{width:36px;height:36px;border-radius:999px;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center}
.send:hover{background:#3b82f6}
.send svg{width:16px;height:16px}
.disc{text-align:center;padding-top:8px;font-size:10px;color:#71717a}

/* overlay: dropdown, sheet, drawer, dialog */
.ov{position:absolute;inset:0;z-index:50}
.ov.dim{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
#modelMenu{top:calc(52px + var(--sat))}
.mm{position:absolute;left:16px;right:16px;top:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.6);max-height:62vh;overflow-y:auto;padding:6px}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:14px}
.mi:hover,.mi.act{background:var(--pill)}
.mi .t{min-width:0;flex:1}
.mi b{display:block;font-size:13px;font-weight:600;color:#f4f4f5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi small{display:block;font-size:11px;color:var(--dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:999px;flex:none}
.mi svg{width:18px;height:18px;color:var(--blue);flex:none}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + var(--sab));border-top:1px solid var(--line)}
.sheet .grip{width:48px;height:4px;background:#52525b;border-radius:999px;margin:0 auto 14px}
.sheet h3{margin:0 0 10px;font-size:14px;font-weight:600;color:#d4d4d8}
.g3{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;text-align:center;font-size:12px;color:#d4d4d8}
.g3 button{display:flex;flex-direction:column;align-items:center;padding:12px;background:rgba(39,39,42,.8);border-radius:16px}
.g3 span{font-size:22px;margin-bottom:4px}
#drawer{display:flex;visibility:hidden;background:rgba(0,0,0,0);transition:background .25s,visibility 0s .25s}
#drawer.open{visibility:visible;background:rgba(0,0,0,.7);transition:background .25s}
.dp{width:288px;max-width:84%;height:100%;background:var(--bg);border-right:1px solid #27272a;padding:calc(16px + var(--sat)) 16px calc(16px + var(--sab));display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .28s cubic-bezier(.3,.8,.3,1);box-shadow:0 0 40px rgba(0,0,0,.6)}
#drawer.open .dp{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid #27272a;margin-bottom:16px}
.dh b{font-size:18px;font-weight:700}
.nb{width:100%;background:rgba(39,39,42,.9);padding:12px 16px;border-radius:16px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:12px}
.nb svg,.di svg{width:16px;height:16px;flex:none}
.dsec{font-size:11px;font-weight:600;color:var(--dark);letter-spacing:.06em;text-transform:uppercase;padding:0 4px;margin:18px 0 6px}
.di{width:100%;text-align:left;padding:10px 12px;border-radius:12px;font-size:13px;color:#d4d4d8;display:flex;align-items:center;gap:12px}
.di:hover{background:rgba(39,39,42,.6)}
.di.cur{background:rgba(39,39,42,.9)}
.di span.l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.di .x{padding:4px;color:#71717a;display:flex}
#recents{flex:1;overflow-y:auto;scrollbar-width:none;min-height:0}
.dfoot{padding-top:12px;border-top:1px solid #27272a}
.dfoot .di{color:#a1a1aa}
.empty{font-size:12px;color:#71717a;padding:6px 12px}

/* schermate a pagina intera */
.screen{position:absolute;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .28s cubic-bezier(.3,.8,.3,1),visibility 0s .28s}
.screen.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.3,.8,.3,1),visibility 0s}
.sh{display:flex;align-items:center;gap:6px;padding:calc(8px + var(--sat)) 12px 8px}
.sh h2{margin:0;font-size:18px;font-weight:600;flex:1}
.sh .tabs{display:flex;background:var(--surface);border-radius:999px;padding:3px}
.sh .tabs button{padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;color:var(--dark)}
.sh .tabs button.on{background:var(--pill);color:#f4f4f5}
.sb{flex:1;overflow-y:auto;padding:8px 20px calc(32px + var(--sab));scrollbar-width:none}
.sb::-webkit-scrollbar{display:none}
.sec{font-size:11px;font-weight:600;color:var(--dark);letter-spacing:.06em;text-transform:uppercase;margin:22px 4px 8px}
.card{background:var(--surface);border:1px solid var(--line2);border-radius:18px;padding:14px}
.card+.card{margin-top:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;background:var(--surface);border:1px solid var(--line2);border-radius:16px;margin-bottom:8px}
.row:hover{background:var(--hover)}
.row .t{flex:1;min-width:0}
.row b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{display:block;font-size:12px;color:var(--dark);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:38px;height:38px;border-radius:999px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.mini{padding:8px;color:#a1a1aa;display:flex;border-radius:999px}
.mini:hover{background:var(--pill);color:#fff}
.mini svg{width:18px;height:18px}
.chev{width:16px;height:16px;color:#71717a;flex:none}
.ks{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--pill);color:var(--dark);flex:none}
.ks.ok{background:rgba(16,185,129,.15);color:#34d399}
.bd{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--pill);color:var(--muted);flex:none}
.bd.free{background:rgba(16,185,129,.15);color:#34d399}
.bd.vis{background:rgba(217,101,112,.18);color:#f19aa2}
.bd.ctx{background:rgba(76,141,246,.15);color:#8db4fa}
.bds{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.5;margin:0 0 14px;background:rgba(76,141,246,.12);color:#b6cffb}
.note.err{background:rgba(248,113,113,.12);color:#fca5a5}
.note.ok{background:rgba(16,185,129,.12);color:#6ee7b7}
.note.warn{background:rgba(245,158,11,.12);color:#fcd34d}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:14px 2px 6px}
.hint{font-size:12px;color:var(--dark);margin:6px 2px 0;line-height:1.5}
.inp{width:100%;background:var(--pill);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;color:#f4f4f5;outline:0}
.inp:focus{border-color:rgba(76,141,246,.7)}
textarea.inp{resize:vertical;min-height:120px;line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:999px;font-size:14px;font-weight:600;background:#27272a;color:#f4f4f5;margin-top:14px}
.btn.pri{background:#2563eb;color:#fff}
.btn.dng{background:rgba(248,113,113,.12);color:#fca5a5}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:10px}
.btns .btn{margin-top:14px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13px}
.kv:last-child{border:0}
.kv span{color:var(--dark);flex:none}
.kv b{font-weight:500;text-align:right;word-break:break-all}
.big{font-size:20px;font-weight:600;margin:0 0 4px}
.center{text-align:center;padding:48px 0}
.spin{width:28px;height:28px;margin:0 auto 14px;border-radius:999px;border:3px solid #3f3f46;border-top-color:var(--blue);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats .card{padding:12px 6px}
.stats b{display:block;font-size:22px}
.stats small{font-size:11px;color:var(--dark)}
.bars{display:flex;align-items:flex-end;gap:4px;height:44px;margin-top:8px}
.bars i{flex:1;background:linear-gradient(to top,#4285f4,#d96570);border-radius:3px;min-height:3px;opacity:.9}
.bars i.z{background:#3f3f46;opacity:1}
.hi{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line2);font-size:13px}
.hi:last-child{border:0}
.hi em{font-style:normal;width:18px;flex:none;font-weight:700}
.hi .t{min-width:0;flex:1}
.hi small{display:block;color:var(--dark);font-size:11.5px}
.hi p{margin:3px 0 0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.sw input{width:44px;height:26px;accent-color:#4c8df6}
select.inp{appearance:none}
#dlg{display:flex;align-items:center;justify-content:center;padding:28px;z-index:80}
.dlgc{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;width:100%}
.dlgc h3{margin:0 0 8px;font-size:17px}
.dlgc p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
#toast{position:absolute;left:50%;bottom:calc(110px + var(--sab));transform:translate(-50%,12px);background:#2e2f31;color:#f4f4f5;border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- aggiunte per la barra laterale dell'HUB ---- */
.pickbtn{margin-top:14px;padding:8px 16px;border-radius:999px;border:1px solid #3c4043;font-size:13px;font-weight:600;color:#9ecbff}
.pickbtn:hover{background:var(--surface)}
.chip.ppt{background:rgba(124,58,237,.18);border-color:rgba(168,85,247,.55)}
.ab2.rec{background:#c5221f;color:#fff;border-radius:999px;padding:8px 12px;gap:6px;align-items:center;font-size:12px;font-weight:700;animation:recp 1.2s infinite}
.ab2.rec svg{width:16px;height:16px}
@keyframes recp{50%{opacity:.7}}
.bub audio{display:block;height:34px;max-width:100%;margin-bottom:6px}
.deck{margin-top:12px;border:1px solid #3c4043;border-radius:16px;overflow:hidden;background:#1a1b1d}
.deck .dh2{padding:14px 16px;background:linear-gradient(135deg,rgba(124,58,237,.35),rgba(6,182,212,.22))}
.deck .dh2 b{display:block;font-size:15px;font-weight:700;color:#fff}
.deck .dh2 small{font-size:12px;color:var(--muted)}
.deck ol{margin:10px 16px 6px;padding-left:22px;font-size:13px;color:var(--muted);max-height:180px;overflow-y:auto}
.deck button{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 24px);margin:6px 12px 12px;padding:11px;border-radius:12px;background:linear-gradient(90deg,#7c3aed,#06b6d4);font-size:13.5px;font-weight:700;color:#fff}
.deck button:disabled{opacity:.6}
.deck button svg{width:18px;height:18px}

  Core.DEFAULT_PROMPT = 'Rispondi sempre in italiano, in modo completo e diretto.';
  Core.defaultConfig = () => ({
    api_keys: {}, api_models: {}, active: '',
    user_name: 'Flubatir', system_prompt: Core.DEFAULT_PROMPT,
    history_enabled: true, max_history: 50,
    web_search: 'auto', web_max_rounds: 2, web_results: 5, web_pages: 2, web_page_chars: 3000,

  Core.resolveKey = (config, keyId, prov) => {
    prov = prov || Core.PROVIDERS[keyId] || {};
    let k = String((config.api_keys || {})[keyId] || '').trim();
    if (!k && prov.legacy) k = String(config[prov.legacy] || '').trim();
    return k;
  };
  Core.maskKey = k => !k ? '-' : (k.length > 12 ? k.slice(0, 4) + '…' + k.slice(-4) : '••••');
  Core.customKeyId = base => {
    let host = base; try { host = new URL(base).host; } catch (e) { /* ignore */ }
    return 'custom-' + (host.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'server');
  };
  Core.makeKey = (modelId, pid, taken) => {
    const slug = modelId.split('/').pop().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 28).replace(/-+$/g, '') || 'api';
    let key = slug;
    if (taken.has(key)) key = (slug + '-' + pid).slice(0, 32);
    let n = 2;
    while (taken.has(key)) { key = (slug + '-' + pid).slice(0, 28) + '-' + n; n++; }
    return key;

      catch (e) { if (e.name === 'AbortError') throw new Error('timeout'); throw e; }
      finally { clearTimeout(t); }

  Core.fetchModels = async function (base, key) {
    const r = await Core.http(base.replace(/\/+$/, '') + '/models', { headers: hdr(key) });
    if (r.status === 401 || r.status === 403) throw new PermissionError('Chiave API non valida o non autorizzata per questo provider');
    if (r.status === 404) throw new Error('Endpoint /models non trovato: controlla l\'URL base');
    if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + r.text.slice(0, 200));
    let data; try { data = r.json(); } catch (e) { throw new Error('Risposta non valida dal server'); }
    const items = Array.isArray(data) ? data : (data.data || data.models || []);
    const out = [], seen = new Set();
    for (const it of items) {
      if (!it || typeof it !== 'object') continue;
      let mid = String(it.id || it.name || '').trim();
      if (mid.startsWith('models/')) mid = mid.slice(7);
      if (!mid || seen.has(mid) || Core.NON_CHAT_RE.test(mid)) continue;
      const arch = it.architecture || {};
      if (arch.output_modalities && !arch.output_modalities.includes('text')) continue;
      const ins = arch.input_modalities || [];
      const pr = it.pricing || {};
      let priceIn = null, free = mid.endsWith(':free');

      seen.add(mid);
      out.push({ id: mid, ctx, free, price_in: priceIn, vision: ins.includes('image') || Core.VISION_RE.test(mid), label: String(it.name || '') });

  Core.testModel = async function (base, key, model) {

    const secs = () => (Date.now() - t0) / 1000;

      const body = { model, messages: [{ role: 'user', content: 'Rispondi solo: ok' }] }; body[param] = 32;

      if (r.status === 400 && param === 'max_tokens' && r.text.includes('max_completion_tokens')) { param = 'max_completion_tokens'; continue; }

  // ============================================================ CHAT (streaming SSE)
  // Converte un flusso SSE OpenAI-compatibile in testo. Il "reasoning" dei modelli viene racchiuso in <think>.
  Core.readSSE = async function* (chunks) {
    let buf = '', thinking = false, sawData = false, raw = '', done = false;
    const handle = line => {
      if (!line || line.startsWith(':')) return '';
      if (!line.startsWith('data:')) { if (raw.length < 1e6) raw += line + '\n'; return ''; }
      sawData = true;
      const d = line.slice(5).trim();
      if (d === '[DONE]') return null;
      let j; try { j = JSON.parse(d); } catch (e) { return ''; }
      if (j.error) return '\n[!] Errore API: ' + (j.error.message || JSON.stringify(j.error));
      const delta = (j.choices && j.choices[0] && j.choices[0].delta) || {};
      const r = typeof delta.reasoning === 'string' ? delta.reasoning : (typeof delta.reasoning_content === 'string' ? delta.reasoning_content : '');
      const c = typeof delta.content === 'string' ? delta.content : '';
      let out = '';
      if (r) { if (!thinking) { out += '<think>'; thinking = true; } out += r; }
      if (c) { if (thinking) { out += '</think>\n'; thinking = false; } out += c; }
      return out;
    };
    outer: for await (const ch of chunks) {
      buf += ch;
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).replace(/\r$/, ''); buf = buf.slice(nl + 1);
        const r = handle(line);
        if (r === null) { done = true; break outer; }
        if (r) yield r;
      }
    }
    if (!done && buf) { const r = handle(buf.replace(/\r$/, '')); if (r) yield r; }
    if (thinking) yield '</think>\n';
    if (!sawData && raw.trim().startsWith('{')) {      // il server ha risposto con un JSON normale
      try {
        const j = JSON.parse(raw);
        if (j.error) yield '[!] Errore API: ' + (j.error.message || JSON.stringify(j.error));
        else { const m = (j.choices && j.choices[0] && j.choices[0].message) || {}; if (m.content) yield m.content; }
      } catch (e) { /* ignore */ }
    }
  };

  Core.bodyChunks = async function* (body) {
    const rd = body.getReader(), dec = new TextDecoder();
    try { for (; ;) { const { done, value } = await rd.read(); if (done) break; yield dec.decode(value, { stream: true }); } }
    finally { try { rd.releaseLock(); } catch (e) { /* ignore */ } }
  };

  // entry = voce di config.api_models; messages = [{role,content}]
  Core.chatStream = async function* (entry, key, messages, ctl) {
    const url = String(entry.base_url || '').replace(/\/+$/, '') + '/chat/completions';
    const headers = { 'Content-Type': 'application/json' };
    if (key) headers.Authorization = 'Bearer ' + key;
    const mkBody = stream => { const b = { model: entry.model, messages, stream }; b[entry.tok_param || 'max_tokens'] = 16000; return JSON.stringify(b); };
    let res;
    try { res = await fetch(url, { method: 'POST', headers, body: mkBody(true), signal: ctl.signal }); }
    catch (e) {
      if (e.name === 'AbortError') return;
      const nat = Core.native();
      if (nat) {                                         // ripiego nativo: niente streaming, ma nessun CORS
        try {
          const r = await nat.request({ url, method: 'POST', headers, data: JSON.parse(mkBody(false)), responseType: 'text', connectTimeout: 30000, readTimeout: 180000 });
          const j = typeof r.data === 'string' ? JSON.parse(r.data) : r.data;
          if (r.status !== 200) { yield '[!] Errore API: ' + r.status + ' - ' + JSON.stringify(j).slice(0, 300); return; }
          const m = j.choices[0].message || {};
          const rs = m.reasoning || m.reasoning_content;
          if (rs) yield '<think>' + rs + '</think>\n';
          yield m.content || '';
        } catch (e2) { yield '[!] Errore connessione: ' + e2.message; }
        return;
      }
      yield '[!] Errore connessione: ' + e.message + '. Controlla internet; se il provider non accetta richieste dal browser (CORS) usa l\'app installata.';
      return;
    }
    if (!res.ok) { let t = ''; try { t = await res.text(); } catch (e) { /* ignore */ } yield '[!] Errore API: ' + res.status + ' - ' + t.slice(0, 300); return; }
    try {
      if (res.body && res.body.getReader) yield* Core.readSSE(Core.bodyChunks(res.body));
      else yield* Core.readSSE((async function* () { yield await res.text(); })());
    } catch (e) { if (e.name !== 'AbortError') yield '\n[!] Errore connessione: ' + e.message; }
    finally { try { ctl.abort(); } catch (e) { /* ignore */ } }
  };

  // ============================================================ PENSIERO + MARKDOWN
  Core.splitThink = t => {
    const s = t.replace(/^\s+/, '');
    if (!s.startsWith('<think>')) return { think: '', answer: t, open: false };
    const e = s.indexOf('</think>');
    if (e === -1) return { think: s.slice(7), answer: '', open: true };
    return { think: s.slice(7, e).trim(), answer: s.slice(e + 8).replace(/^\s+/, ''), open: false };
  };
  Core.stripThink = t => t.replace(/<think>[\s\S]*?<\/think>\s*/g, '');

  function inline(s) {
    const toks = [];
    s = s.replace(/`([^`\n]+)`/g, (m, c) => { toks.push('<code>' + esc(c) + '</code>'); return '\u0001' + (toks.length - 1) + '\u0002'; });
    s = esc(s);
    s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
    s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
    return s.replace(/\u0001(\d+)\u0002/g, (m, i) => toks[+i]);
  }
  Core.md = function (src) {
    const codes = [];
    src = String(src).replace(/```([^\n`]*)\n([\s\S]*?)(?:```|$)/g, (m, l, c) => { codes.push({ l: l.trim(), c: c.replace(/\n$/, '') }); return '\n\u0003' + (codes.length - 1) + '\u0004\n'; });
    const lines = src.split('\n'); let out = '', i = 0, para = [];
    const flush = () => { if (para.length) { out += '<p>' + inline(para.join('\n')).replace(/\n/g, '<br>') + '</p>'; para = []; } };
    const SEP = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
    const BUL = /^\s*[-*+]\s+(.*)$/, ORD = /^\s*\d+[.)]\s+(.*)$/;
    while (i < lines.length) {
      const ln = lines[i]; let m;
      if ((m = ln.match(/^\u0003(\d+)\u0004$/))) {
        flush(); const c = codes[+m[1]];
        out += '<div class="code"><div class="code-h"><span>' + esc(c.l || 'codice') + '</span><button class="copy-btn" type="button">Copia</button></div><pre><code>' + esc(c.c) + '</code></pre></div>';
        i++; continue;
      }
      if (!ln.trim()) { flush(); i++; continue; }
      if ((m = ln.match(/^(#{1,4})\s+(.*)$/))) { flush(); const n = m[1].length + 1; out += '<h' + n + '>' + inline(m[2]) + '</h' + n + '>'; i++; continue; }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(ln)) { flush(); out += '<hr>'; i++; continue; }
      if (ln.includes('|') && i + 1 < lines.length && SEP.test(lines[i + 1])) {
        flush();
        const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        const head = cells(ln); i += 2; const rows = [];
        while (i < lines.length && lines[i].trim() && lines[i].includes('|')) { rows.push(cells(lines[i])); i++; }
        out += '<div class="tbl"><table><thead><tr>' + head.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' +
          rows.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
        continue;
      }
      if (/^\s*>/.test(ln)) {
        flush(); const q = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        out += '<blockquote>' + inline(q.join('\n')).replace(/\n/g, '<br>') + '</blockquote>'; continue;
      }
      if (BUL.test(ln) || ORD.test(ln)) {
        flush(); const ord = ORD.test(ln) && !BUL.test(ln), re = ord ? ORD : BUL, items = [];
        while (i < lines.length && re.test(lines[i])) { items.push(lines[i].match(re)[1]); i++; }
        const tag = ord ? 'ol' : 'ul';
        out += '<' + tag + '>' + items.map(x => '<li>' + inline(x) + '</li>').join('') + '</' + tag + '>'; continue;
      }
      para.push(ln); i++;
    }
    flush(); return out;
  };

  const TAG_RE = /^\[\[\s*(?:CERCA|SEARCH)\s*:\s*([\s\S]+?)\s*\]\]/i;

  Core.TAG_RE = TAG_RE;

  // Avvolge lo stream di testo: emette ['text', chunk] oppure ['search', query].
  Core.intercept = async function* (stream, allow) {
    if (allow === undefined) allow = true;
    if (!allow) { for await (const c of stream) yield ['text', c]; return; }
    let phase = 'think?', buf = '';
    for await (const chunk of stream) {
      if (phase === 'pass') { yield ['text', chunk]; continue; }
      buf += chunk;
      if (phase === 'think?') {
        const s = buf.trimStart();
        if (s.startsWith('<think>')) phase = 'think';
        else if ('<think>'.startsWith(s)) continue;
        else phase = 'decide';
      }
      if (phase === 'think') {
        const end = buf.indexOf('</think>');
        if (end === -1) { yield ['text', buf]; buf = ''; continue; }
        const e = end + 8; yield ['text', buf.slice(0, e)]; buf = buf.slice(e); phase = 'decide';
      }
      if (phase === 'decide') {
        const s = buf.trimStart(), m = s.match(TAG_RE);
        if (m) { yield ['search', m[1].trim()]; return; }
        const u = s.toUpperCase();
        const maybe = s ? OPENERS.some(o => o.startsWith(u.slice(0, o.length)) || u.startsWith(o)) : true;
        if (maybe && s.length < 300) continue;
        yield ['text', buf]; buf = ''; phase = 'pass';
      }
    }
    if (buf) {
      const m = buf.trimStart().match(TAG_RE);
      if (m && phase === 'decide') yield ['search', m[1].trim()]; else yield ['text', buf];
    }
  };

  const clean = s => String(s || '').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/\s+/g, ' ').trim();

  Core.parseDdgHtml = function (page, n) {

      try { const u = new URL(href, 'https://duckduckgo.com'); href = u.searchParams.get('uddg') || u.href; } catch (e) { /* ignore */ }
      if (!/^https?:/.test(href) || href.includes('duckduckgo.com/y.js')) continue;
      const s = el.querySelector('.result__snippet');
      out.push({ title: clean(a.textContent), url: href, snippet: s ? clean(s.textContent) : '' });
      if (out.length >= n) break;
    }
    return out;
  };

  Core.webSearch = async function (query, cfg, n) {

  // ============================================================ MAIL (come gpt_mail.py, via EmailJS)
  Core.genCode = () => {
    const d = new Date(), p = (n, l) => String(n).padStart(l || 2, '0');
    const a = new Uint8Array(3); (root.crypto || {}).getRandomValues ? root.crypto.getRandomValues(a) : a.forEach((_, i) => { a[i] = Math.random() * 256; });
    const rnd = [...a].map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
    return 'MSG-' + rnd + '-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  };
  Core.mailReady = m => !!(m && m.service && m.template && m.key);
  // L'oggetto e' solo il codice; la risposta va a reply_to. Il destinatario e' fissato nel template EmailJS.
  Core.sendMail = async function (m, body, userEmail, code) {
    const coda = '\n\nCodice: ' + code + '\nRisposta attesa a: ' + (userEmail || 'Non specificata') + '\n';
    let r;
    try {
      r = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ service_id: m.service, template_id: m.template, user_id: m.key,
          template_params: { subject: code, code, message: body + coda, reply_to: userEmail || '', from_name: 'GPT CORE Mobile' } }),
      });
    } catch (e) { throw new Error('Impossibile raggiungere EmailJS: controlla la connessione a Internet.'); }
    const t = await r.text();

    let webCtx = '', rounds = 0, full = '', sources = [];

    const am = { role: 'assistant', content: full.trim() || (stopped ? '(interrotto)' : '[!] Nessuna risposta dal modello'), src: sources, err: isErr, skip: stopped };

  }

  // ============================================================ STORE API
  const S = { run: 0, view: 'home', pid: '', base: '', key: '', keyId: '', fresh: false, change: false, models: [], q: '', lim: 60, chosen: null, alias: '', err: '', msg: null, test: null, url: '' };

  function storeBack() {

    const V = {
      home() {
        const act = engine() && engine()[0], added = engineList();

          `<div class="row" ${isAdm() ? 'data-act="syn" style="cursor:pointer"' : ''}><span class="av syn-av">S</span><div class="t"><b>synapse</b><small>Gemini/Qwen → Slidev → Presenton</small></div><span class="bd free">predefinita</span>${act === SYN ? '<span class="ks ok">attiva</span>' : `<button class="mini" data-act="use" data-a="${SYN}" title="Usa">${I.check}</button>`}${I.chev}</div>`;
        h += added.length ? added.map(([a, e]) => `<div class="row"><span class="av" style="background:${color(a)}">${esc(a[0].toUpperCase())}</span><div class="t"><b>${esc(a)}</b><small>${esc(e.provider_name || e.provider)} · ${esc(e.model)}</small></div>${a === act ? '<span class="ks ok">attiva</span>' : `<button class="mini" data-act="use" data-a="${esc(a)}" title="Usa">${I.check}</button>`}${isAdm() ? `<button class="mini" data-act="vis" data-a="${esc(a)}" title="Immagini ${e.vision ? 'attive' : 'disattivate'}" style="${e.vision ? '' : 'opacity:.35'}">👁</button><button class="mini" data-act="rm" data-a="${esc(a)}" title="Rimuovi">${I.trash}</button>` : ''}</div>`).join('')
          : '<div class="card" style="font-size:13px;color:var(--muted);line-height:1.55">' + (isAdm() ? 'Non hai ancora nessuna API. Scegli un provider qui sotto, incolla la chiave e seleziona un modello: comparirà nel menu in alto.' : 'Nessun modello è stato ancora aggiunto: chiedi al rappresentante.') + '</div>';

        }).join('');

        } else h += '<div class="hint" style="margin-top:14px">I modelli sono comuni a tutta la classe: scegli quello da usare col pulsante ✓. Le tue chat restano solo tue.</div>';

      },
      key() {

        return `<p class="big">${esc(p.name)}</p>` + (S.err ? noteH('err', S.err) : '') +

          `<label class="lbl">Chiave API${S.change && keyOf(S.pid) ? ' (attuale: ' + esc(C.maskKey(keyOf(S.pid))) + ')' : ''}</label><input class="inp" id="kIn" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Incolla qui la chiave">` +

      },
      custom() {
        return `<p class="big">Server personalizzato</p>` + (S.err ? noteH('err', S.err) : '') +
          noteH('info', 'Inserisci l\'URL base di un server compatibile OpenAI (quello che precede /chat/completions).') +
          `<label class="lbl">URL base</label><input class="inp" id="cUrl" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://api.tuoserver.it/v1" value="${esc(S.url)}">` +
          `<div class="hint">Esempi: http://192.168.1.10:1234/v1 (LM Studio), http://192.168.1.10:8000/v1 (vLLM)</div>` +
          `<label class="lbl">Chiave API (facoltativa)</label><input class="inp" id="cKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Lascia vuoto se il server non la richiede">` +
          `<button class="btn pri" data-act="custok">Collega</button>`;

      syn() {

        const opts = ['<option value="auto">Auto (prima Gemini, poi Qwen)</option>'].concat(engineList().map(([a, e]) => `<option value="${esc(a)}">${esc(a)} · ${esc(e.model)}</option>`)).join('');
        const hasP = !!String(config.api_keys.presenton || '').trim();
        return `<p class="big">Synapse</p>` +
          noteH('info', 'Tre IA lavorano insieme. Il cervello (Gemini o Qwen) riassume il contenuto e scrive le slide. Slidev le impagina e crea il PDF tramite GitHub Actions. Poi il cervello controlla le immagini e, se serve, rimanda indietro una versione corretta. Se Slidev non parte, si passa a Presenton.') +
          `<div class="sec">1 · Cervello</div>` +
          (br ? noteH('ok', 'In uso: ' + br[0] + ' · ' + br[1].model) : noteH('warn', 'Nessun modello Gemini o Qwen aggiunto: aggiungine uno dai provider qui sotto (per esempio Google Gemini o OpenRouter).')) +
          `<select class="inp" id="synBrain">${opts}</select>` +
          `<div class="sec">2 · Slidev (GitHub Actions)</div>` +
          (syncUrl() ? noteH('ok', 'Apps Script collegato.') : noteH('warn', 'URL di Apps Script mancante: nell\'HUB arriva in automatico, qui puoi inserirlo a mano.')) +
          `<label class="lbl" style="margin-top:0">URL Apps Script (vuoto = quello dell'HUB)</label><input class="inp" id="synSync" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(sy.sync_url)}">` +
          `<label class="lbl">Numero di slide di partenza</label><input class="inp" id="synN" type="number" min="3" max="20" value="${esc(sy.slides)}">` +
          `<label class="lbl">Attesa massima per Slidev (secondi)</label><input class="inp" id="synWait" type="number" min="60" max="900" value="${esc(sy.wait_s)}"><div class="hint">Passato questo tempo senza PDF, Synapse passa a Presenton.</div>` +
          `<div class="sec">3 · Presenton (ripiego, solo API)</div>` +
          `<label class="lbl" style="margin-top:0">Chiave API Presenton${hasP ? ' (attuale: ' + esc(C.maskKey(config.api_keys.presenton)) + ')' : ''}</label><input class="inp" id="synPK" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-presenton-…">` +
          `<div class="hint">Si crea su presenton.ai/api-key. Lascia vuoto per non cambiarla.</div>` +
          `<label class="lbl">URL base API</label><input class="inp" id="synPU" inputmode="url" autocapitalize="off" spellcheck="false" value="${esc(sy.presenton_url)}">` +
          `<label class="lbl">Template</label><input class="inp" id="synPT" autocapitalize="off" spellcheck="false" placeholder="general" value="${esc(sy.presenton_template)}"><div class="hint">Per esempio general, modern, standard, swift.</div>` +
          `<button class="btn pri" data-act="synsave">Salva</button>` + (hasP ? '<button class="btn dng" data-act="synkeydel">Elimina la chiave Presenton</button>' : '');
      },
      loading: () => `<div class="center"><div class="spin"></div><div>${esc(S.loadMsg || 'Attendi…')}</div></div>`,
      testing: () => `<div class="center"><div class="spin"></div><div>Provo ${esc(S.chosen.id)}…</div></div>`,
      models() {
        return `<div class="kv" style="border:0;padding-top:0"><span>Provider</span><b>${esc(PV[S.pid].name)}</b></div><input class="inp" id="mq" placeholder="Cerca tra ${S.models.length} modelli…" value="${esc(S.q)}" autocapitalize="off" spellcheck="false"><div id="mList" style="margin-top:12px"></div>`;
      },
      summary() {
        const m = S.chosen;
        return `<p class="big" style="word-break:break-all">${esc(m.id)}</p><div class="bds" style="margin:0 0 14px">${m.free ? '<span class="bd free">gratis</span>' : ''}${m.vision ? '<span class="bd vis">visione</span>' : ''}${m.ctx ? `<span class="bd ctx">${C.fmtCtx(m.ctx)} ctx</span>` : ''}</div>` +
          `<div class="card"><div class="kv"><span>Provider</span><b>${esc(PV[S.pid].name)}</b></div><div class="kv"><span>Endpoint</span><b>${esc(S.base)}</b></div><div class="kv"><span>Chiave</span><b>${S.key ? esc(C.maskKey(S.key)) : 'nessuna'}</b></div><div class="kv"><span>Modalità</span><b>${m.vision ? 'Visione + testo' : 'Solo testo'}</b></div></div>` +
          `<label class="lbl">Nome nel menu</label><input class="inp" id="aIn" value="${esc(S.alias)}" autocapitalize="off" spellcheck="false">` +
          (S.err ? noteH('err', S.err).replace('class="note', 'style="margin-top:10px" class="note') : '<div class="hint">Minuscole, numeri e . _ - (max 32 caratteri).</div>') +
          `<div class="sw" style="margin-top:14px"><span style="font-size:14px">Il modello supporta le immagini</span><input id="aVis" type="checkbox" ${m.vision ? 'checked' : ''}></div>` +
          `<button class="btn pri" data-act="addgo">Testa e aggiungi</button>`;
      },
      testfail() {
        return noteH('err', 'Il test non è andato a buon fine: ' + S.test.msg) + noteH('info', 'Puoi aggiungerla comunque (per esempio se la quota è esaurita), ma potrebbe non rispondere.') +
          `<button class="btn pri" data-act="addforce">Aggiungi comunque</button><button class="btn" data-act="back">Annulla</button>`;
      },
      done() {
        return noteH('ok', 'API aggiunta con successo!' + (S.test && S.test.ok ? ' Risposta in ' + S.test.secs.toFixed(1) + ' s.' : '')) +
          `<div class="card"><div class="kv"><span>Nome</span><b>${esc(S.alias)}</b></div><div class="kv"><span>Provider</span><b>${esc(PV[S.pid].name)}</b></div><div class="kv"><span>Modello</span><b>${esc(S.chosen.id)}</b></div></div>` +
          `<button class="btn pri" data-act="usenow">Usa subito</button><button class="btn" data-act="back">Aggiungi un'altra</button>`;
      },

    b.innerHTML = V[S.view]();
    if (S.view === 'syn') { const sel = $('#synBrain'); if (sel) sel.value = config.synapse.brain || 'auto'; }
    if (S.view === 'models') renderModelList();
    if (S.view === 'key') setTimeout(() => { const k = $('#kIn'); if (k) k.focus(); }, 320);
  }

  function renderModelList() {
    const w = S.q.toLowerCase().split(/\s+/).filter(Boolean);
    const flt = w.length ? S.models.filter(m => w.every(x => m.id.toLowerCase().includes(x))) : S.models;
    const shown = flt.slice(0, S.lim);
    $('#mList').innerHTML = shown.length ? shown.map(m => `<button class="row" data-act="pick" data-id="${esc(m.id)}" style="display:block"><b>${esc(m.id)}</b><div class="bds">${m.free ? '<span class="bd free">gratis</span>' : ''}${m.vision ? '<span class="bd vis">visione</span>' : ''}${m.ctx ? `<span class="bd ctx">${C.fmtCtx(m.ctx)} ctx</span>` : ''}${m.price_in ? `<span class="bd">$${m.price_in.toFixed(2)}/M</span>` : ''}</div></button>`).join('') +
      (flt.length > S.lim ? `<button class="btn" data-act="more">Mostra altri (${flt.length - S.lim})</button>` : '')
      : noteH('warn', 'Nessun modello corrisponde alla ricerca.');
  }

  async function loadModels() {
    S.view = 'loading'; S.loadMsg = 'Collegamento a ' + PV[S.pid].name + '…'; renderStore();
    let models; const run = S.run;
    try { models = await C.fetchModels(S.base, S.key); }
    catch (e) {
      if (run !== S.run) return;
      if (e.name === 'PermissionError') { S.err = e.message + '. Controlla la chiave.'; S.view = S.pid === 'custom' ? 'custom' : 'key'; return renderStore(); }
      flash('err', 'Impossibile ottenere i modelli: ' + (e.message === 'Failed to fetch' ? 'connessione fallita (controlla internet o l\'URL; alcuni provider non accettano richieste dal browser: usa l\'app installata)' : e.message));
      S.view = 'home'; return renderStore();
    }
    if (run !== S.run) return;
    if (S.fresh) { config.api_keys[S.keyId] = S.key; saveCfg(); S.fresh = false; }
    if (!models.length) { flash('warn', 'Il provider non ha restituito modelli di chat utilizzabili.'); S.view = 'home'; return renderStore(); }
    S.models = models; S.q = ''; S.lim = 60; S.view = 'models'; renderStore();
  }

  async function startAdd(pid) {
    S.pid = pid; S.msg = null; S.err = ''; S.change = false;
    if (pid === 'custom') { S.view = 'custom'; return renderStore(); }
    S.base = PV[pid].base; S.keyId = pid;
    const k = keyOf(pid);
    if (!k) { S.view = 'key'; return renderStore(); }
    S.key = k; S.fresh = false; loadModels();
  }

  function normUrl(u) {
    u = u.trim(); if (!u) return '';
    if (!/^https?:\/\//i.test(u)) u = (/^(localhost|127\.|192\.168\.|10\.)/.test(u) ? 'http://' : 'https://') + u;
    return u.replace(/\/+$/, '');
  }

  function saveEntry() {
    const m = S.chosen;
    config.api_models[S.alias] = { provider: S.pid, provider_name: PV[S.pid].name, model: m.id, base_url: S.base, key_id: S.keyId, keyless: !S.key, ctx: m.ctx, vision: !!m.vision, tok_param: (S.test && S.test.param) || 'max_tokens' };
    if (!config.active || !config.api_models[config.active]) config.active = S.alias;
    saveCfg(); renderPill();
  }

  sb().addEventListener('input', e => { if (e.target.id === 'mq') { S.q = e.target.value; S.lim = 60; renderModelList(); } });
  sb().addEventListener('click', async e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act;
    if (act === 'syn') { S.view = 'syn'; S.msg = null; return renderStore(); }
    if (act === 'synsave') {
      const sy = config.synapse;
      sy.brain = $('#synBrain').value || 'auto'; sy.sync_url = $('#synSync').value.trim();
      sy.slides = Math.min(20, Math.max(3, parseInt($('#synN').value, 10) || 8)); sy.wait_s = Math.min(900, Math.max(60, parseInt($('#synWait').value, 10) || 360));
      sy.presenton_url = ($('#synPU').value.trim() || 'https://api.presenton.ai').replace(/\/+$/, ''); sy.presenton_template = $('#synPT').value.trim() || 'general';
      const k = $('#synPK').value.trim(); if (k) config.api_keys.presenton = k;
      saveCfg(); memSwitch(); flash('ok', 'Synapse salvato.'); S.view = 'home'; return renderStore();
    }
    if (act === 'synkeydel') { delete config.api_keys.presenton; saveCfg(); flash('ok', 'Chiave di Presenton eliminata.'); S.view = 'syn'; return renderStore(); }
    if (act === 'prov') { if (e.target.closest('[data-act="chgkey"]')) return; return startAdd(el.dataset.p); }
    if (act === 'chgkey') { e.stopPropagation(); const pid = el.dataset.p; if (pid === 'custom') return; S.pid = pid; S.change = true; S.err = ''; S.view = 'key'; return renderStore(); }
    if (act === 'use') { config.active = el.dataset.a; saveCfg(); renderPill(); return renderStore(); }
    if (act === 'vis') { const x = config.api_models[el.dataset.a]; if (x) { x.vision = !x.vision; saveCfg(); toast(x.vision ? 'Immagini attivate per «' + el.dataset.a + '»' : 'Immagini disattivate per «' + el.dataset.a + '»'); renderStore(); } return; }
    if (act === 'rm') {
      const a = el.dataset.a;
      if (await ask('Rimuovere «' + a + '»?', 'La API verrà tolta dal menu. La chiave del provider resta salvata.', 'Rimuovi', true)) {
        delete config.api_models[a]; if (config.active === a) config.active = ''; engine(); saveCfg(); renderPill(); flash('ok', 'API «' + a + '» rimossa.'); renderStore();
      } return;
    }
    if (act === 'keyok') {
      const k = ($('#kIn').value || '').trim(); if (!k) { S.err = 'Incolla la chiave.'; return renderStore(); }
      if (S.change) {
        S.view = 'loading'; S.loadMsg = 'Verifico la chiave con ' + PV[S.pid].name + '…'; renderStore(); const run = S.run;
        try { await C.fetchModels(PV[S.pid].base, k); if (run !== S.run) return; config.api_keys[S.pid] = k; saveCfg(); flash('ok', 'Chiave di ' + PV[S.pid].name + ' verificata e salvata (' + C.maskKey(k) + ').'); S.view = 'home'; }
        catch (err) { if (run !== S.run) return; S.err = (err.name === 'PermissionError' ? err.message : 'Impossibile verificare: ' + err.message) + '. La chiave NON è stata salvata.'; S.view = 'key'; }
        return renderStore();
      }
      S.key = k; S.fresh = true; return loadModels();
    }
    if (act === 'keydel') { delete config.api_keys[S.pid]; saveCfg(); flash('ok', 'Chiave di ' + PV[S.pid].name + ' eliminata.'); S.view = 'home'; return renderStore(); }
    if (act === 'custok') {
      const u = normUrl($('#cUrl').value); S.url = $('#cUrl').value;
      if (!u) { S.err = 'Inserisci l\'URL del server.'; return renderStore(); }
      S.base = u; S.keyId = C.customKeyId(u);
      const typed = ($('#cKey').value || '').trim();
      S.key = typed || C.resolveKey(config, S.keyId, PV.custom); S.fresh = !!typed && typed !== C.resolveKey(config, S.keyId, PV.custom); S.err = '';
      return loadModels();
    }
    if (act === 'more') { S.lim += 60; return renderModelList(); }
    if (act === 'pick') {
      S.chosen = S.models.find(m => m.id === el.dataset.id);
      const taken = new Set(Object.keys(config.api_models));
      S.alias = C.makeKey(S.chosen.id, S.pid, taken); S.err = ''; S.view = 'summary'; return renderStore();
    }
    if (act === 'addgo') {
      const a = ($('#aIn').value || '').trim().toLowerCase(); S.alias = a;
      if (!C.ALIAS_RE.test(a)) { S.err = 'Nome non valido: minuscole, numeri e . _ - (max 32 caratteri).'; return renderStore(); }
      if (config.api_models[a]) { S.err = '«' + a + '» è già in uso: scegline un altro.'; return renderStore(); }
      if ($('#aVis')) S.chosen.vision = $('#aVis').checked;
      S.err = ''; S.view = 'testing'; renderStore(); const run = S.run;
      const test = await C.testModel(S.base, S.key, S.chosen.id);
      if (run !== S.run) return;                    // l'utente e' tornato indietro: non aggiungere nulla
      S.test = test;
      if (!S.test.ok) { S.view = 'testfail'; return renderStore(); }
      saveEntry(); S.view = 'done'; return renderStore();
    }
    if (act === 'addforce') { saveEntry(); S.view = 'done'; return renderStore(); }
    if (act === 'usenow') { config.active = S.alias; saveCfg(); renderPill(); S.view = 'home'; S.msg = null; closeScreen('store'); toast('Attiva: ' + S.alias); return; }
    if (act === 'back') { S.view = 'home'; S.msg = null; return renderStore(); }
  });

  // ============================================================ MAIL
  const M = { tab: 'write', step: 'compose', body: '', email: '', err: '', res: null };
  const mb = () => $('#mailBody');
  $('#tabW').onclick = () => { M.tab = 'write'; M.step = M.step === 'sending' ? 'sending' : 'compose'; renderMail(); };
  $('#tabH').onclick = () => { M.tab = 'hist'; renderMail(); };

  function renderMail() {
    $('#tabW').classList.toggle('on', M.tab === 'write'); $('#tabH').classList.toggle('on', M.tab === 'hist');
    const ready = C.mailReady(config.mail);
    let h = '';
    if (M.tab === 'hist') {
      const ok = mailHist.filter(x => x.ok).length, ko = mailHist.length - ok;
      const days = [...Array(14)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - (13 - i)); return d.toDateString(); });
      const cnt = days.map(d => mailHist.filter(x => x.ok && new Date(x.ts).toDateString() === d).length), mx = Math.max(1, ...cnt);

  function parseJson(t) {

  // ---- Slidev: invio ad Apps Script (azione "avvia"), attesa (azione "stato" ogni 10 s), verifica con il cervello
  async function waitJob(id, st) {
    const t0 = Date.now(), limit = (parseInt(config.synapse.wait_s, 10) || 360) * 1000, line = st('⏳ Slidev sta generando il PDF…');
    let fails = 0;
    for (; ;) {

      let s;
      try { s = await gas({ action: 'stato', id }, 45000); fails = 0; }
      catch (e) { if (++fails >= 3) throw e; continue; }
      const secs = Math.round((Date.now() - t0) / 1000);
      if (s.state === 'ready') { line.textContent = '✅ Slidev: PDF pronto (' + secs + ' s)'; return s; }
      if (s.state === 'failed') { const fe = new Error('errore in GitHub Actions' + (s.error ? ': ' + String(s.error).split('\n').slice(-3).join(' ').slice(0, 200) : '')); fe.slidevLog = String(s.error || 'errore sconosciuto').slice(-1500); throw fe; }
      if (Date.now() - t0 > limit) throw new Error('nessuna risposta entro ' + Math.round(limit / 1000) + ' s');

    }

  async function reviewDeck(id, md, query, brain, bKey, st) {

      const imgs = bEntry.vision ? pngs.map(x => ({ type: 'image_url', image_url: { url: 'data:image/png;base64,' + x.data } })) : [];
      const head = VERIFY + query.slice(0, 1500) + (imgs.length ? '' : '\n(Non puoi vedere le immagini: controlla solo il markdown.)') + '\n\nMARKDOWN:\n' + md;
      const rv = parseReview(await llm(bEntry, bKey, [{ role: 'user', content: imgs.length ? [{ type: 'text', text: head }, ...imgs] : head }]));
      line.textContent = rv.ok ? '✅ ' + bAlias + ': tutto corretto' : '🔁 ' + bAlias + ' ha trovato problemi: ' + (rv.problems[0] || 'da correggere');
      return rv;
    } catch (e) {
      if (stopped) throw e;
      line.textContent = '⚠️ Verifica non riuscita (' + e.message + '): consegno la versione generata';
      return { ok: true, problems: [], markdown: '', skipped: true };
    }
  }
  async function slidevFlow(md, query, brain, bKey, st) {
    const maxFix = Math.max(0, parseInt(config.synapse.max_fix, 10) || 2);
    let id = newJobId(), tries = 0, repairs = 0;
    for (; ;) {
      st('🚀 Slidev: invio il lavoro ' + id);
      const a = await gas({ action: 'avvia', id, markdown: md }, 60000);
      if (!a || !a.id) throw new Error('Apps Script non ha le azioni Synapse: aggiorna Code.gs e ridistribuisci come "Nuova versione"');
      let r;
      try { r = await waitJob(id, st); }
      catch (e) {
        if (!e.slidevLog || repairs >= 1) throw e;                 // errore del markdown: il cervello lo corregge una volta
        repairs++; st('🛠️ ' + brain[0] + ' corregge le slide dopo l\'errore di Slidev…');
        md = cleanMd(await llm(brain[1], bKey, [{ role: 'system', content: slidevSys(parseInt(config.synapse.slides, 10) || 8) },
          { role: 'user', content: 'Slidev ha dato questo errore:\n' + e.slidevLog + '\n\nMarkdown da correggere:\n' + md + '\n\nRiscrivi TUTTO il markdown corretto (stesso formato), senza spiegazioni.' }]));
        id = newJobId(); continue;
      }
      const rv = await reviewDeck(id, md, query, brain, bKey, st);
      if (rv.ok || tries >= maxFix || !rv.markdown || rv.markdown.length < 20) return { id, md, pages: r.pages || 0, url: r.url || '', problems: rv.ok ? [] : rv.problems };
      tries++; md = rv.markdown; id = newJobId();
    }
  }

  // ---- Presenton (ripiego): tutto via API
  async function presentonFlow(md, st) {
    const sy = config.synapse, key = String(config.api_keys.presenton || '').trim();
    if (!key) throw new Error('manca la chiave API di Presenton (Store API → synapse)');
    const base = String(sy.presenton_url || 'https://api.presenton.ai').replace(/\/+$/, '');
    st('🎞️ Presenton: genero la presentazione (può richiedere un minuto)…');
    const body = { content: mdToPlain(md), n_slides: countSlides(md), language: sy.lang || 'Italian', template: sy.presenton_template || 'general', tone: 'professional', content_generation: 'preserve', export_as: 'pptx' };
    if (sy.presenton_theme) body.theme = sy.presenton_theme;
    let r;
    try { r = await C.http(base + '/api/v1/ppt/presentation/generate', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json', Authorization: 'Bearer ' + key }, body: JSON.stringify(body), timeout: 300000, proxy: (config.cors_proxy || '').trim() }); }
    catch (e) { throw new Error(e.message === 'Failed to fetch' ? 'connessione fallita (nel browser Presenton può bloccare la richiesta: usa l\'app installata o un proxy CORS)' : e.message); }
    if (!r.ok) throw new Error('Presenton HTTP ' + r.status + ': ' + r.text.slice(0, 200).replace(/\n/g, ' '));
    let j; try { j = r.json(); } catch (e) { throw new Error('risposta di Presenton non valida'); }
    const abs = u => !u ? '' : /^https?:/i.test(u) ? u : base + (String(u).startsWith('/') ? '' : '/') + u;
    if (!j.path && !j.edit_path) throw new Error('Presenton non ha restituito nessun file');
    return { pptx: abs(j.path), edit: abs(j.edit_path), pid: j.presentation_id || '' };
  }

  // ---- il ciclo completo, chiamato da send() quando "synapse" è l'IA attiva
  async function synapseRun(o) {
    const sy = config.synapse, node = o.node;
    const st = t => { const s = document.createElement('span'); s.textContent = t; node.stat.appendChild(s); main.scrollTop = main.scrollHeight; return s; };
    const brain = pickBrain();
    if (!brain) throw new Error('Synapse ha bisogno di un cervello: aggiungi un modello Gemini o Qwen dallo Store API.');
    const [bAlias, bEntry] = brain, bKey = C.resolveKey(config, bEntry.key_id || bEntry.provider, C.PROVIDERS[bEntry.provider]);
    if (!bKey && !bEntry.keyless) throw new Error('Chiave mancante per ' + (bEntry.provider_name || bEntry.provider) + ' (cervello di Synapse).');
    node.txt.innerHTML = '<span class="pulse">Synapse sta lavorando…</span>';
    let md = await writeDeck(o, brain, bKey, st);
    if (md.length < 20) throw new Error('il cervello non ha prodotto delle slide valide');
    let why = '';
    try {
      const res = await slidevFlow(md, o.query, brain, bKey, st), title = mdTitle(res.md);
      return { role: 'assistant', content: 'Ecco la presentazione «' + title + '».' + (res.problems.length ? ' Il revisore segnala ancora qualche dubbio (vedi sotto).' : ''), syn: { engine: 'slidev', id: res.id, title, pages: res.pages, url: res.url, md: res.md, notes: res.problems }, src: [] };
    } catch (e) { if (stopped) throw e; why = e.message; }
    st('⚠️ Slidev non è partito (' + why + '): passo a Presenton');
    try {
      const p = await presentonFlow(md, st), title = mdTitle(md);
      return { role: 'assistant', content: 'Slidev non è partito (' + why + '), quindi ho usato Presenton. Ecco la presentazione «' + title + '».', syn: { engine: 'presenton', title, pptx: p.pptx, edit: p.edit, notes: [] }, src: [] };
    } catch (e) {
      if (stopped) throw e;
      return { role: 'assistant', content: '⚠️ Non sono riuscito a creare il file.\n\n- Slidev: ' + why + '\n- Presenton: ' + e.message + '\n\nHo comunque scritto le slide: copiale o riprova.\n\n```markdown\n' + md + '\n```', src: [], skip: true };
    }
  }

  function synHTML(s) {
    const isS = s.engine === 'slidev';

  function findSyn(id) { for (const c of chats) for (const m of c.messages) if (m.syn && m.syn.id === id) return m.syn; return null; }
  main.addEventListener('click', async e => {

        const url = URL.createObjectURL(new Blob([u8], { type: 'application/pdf' })), a = document.createElement('a');
        a.href = url; a.download = slug(s && s.title) + '.pdf'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);

  // ============================================================ MEMORIA PER UTENTE (salvata in Google Sheets tramite Apps Script)
  const MEMK = u => 'gptcore.mem.' + u;
  const mem = { user: '', facts: [], base: 0, dirty: false, sync: 'off', err: '', pulling: false };
  const memUser = () => String(EMBED ? hubName : (config.user_name || '')).trim();
  function memSave() { if (mem.user) jset(MEMK(mem.user), { facts: mem.facts, base: mem.base, dirty: mem.dirty }); }
  function memPaint() { if ($('#scrMem').classList.contains('open')) renderMem(); }
  function memSwitch() {
    const u = memUser();
    if (u !== mem.user) {
      mem.user = u; const l = u ? jget(MEMK(u), null) : null;
      mem.facts = (l && Array.isArray(l.facts)) ? l.facts : []; mem.base = (l && l.base) || 0; mem.dirty = !!(l && l.dirty); mem.sync = 'off'; mem.err = '';
    }
    if (u && syncUrl()) memPull(); else { mem.sync = 'off'; memPaint(); }
  }
  let memT = 0;
  function memSched() { clearTimeout(memT); memT = setTimeout(memPush, 900); }
  async function memPull() {
    if (!mem.user || !syncUrl() || mem.pulling) return;
    mem.pulling = true;
    try {
      const r = await gas({ action: 'mem_get', user: mem.user }, 45000);
      if (mem.dirty || (!r.found && mem.facts.length)) { mem.pulling = false; return memPush(); }
      if (r.found && Array.isArray(r.facts) && r.updated !== mem.base) { mem.facts = r.facts; mem.base = r.updated; memSave(); }
      mem.sync = 'ok'; mem.err = '';
    } catch (e) { mem.sync = 'err'; mem.err = e.message; }
    finally { mem.pulling = false; }
    memPaint();
  }
  async function memPush(retry) {
    if (!mem.user || !syncUrl()) { memPaint(); return; }
    mem.sync = 'busy'; memPaint();
    try {
      const r = await gas({ action: 'mem_set', user: mem.user, facts: mem.facts, base: mem.base }, 45000);
      if (r.conflict && !retry) {                                    // un altro dispositivo ha scritto nel frattempo: unisco i ricordi
        const have = new Set(mem.facts.map(f => f.t.toLowerCase()));
        (r.facts || []).forEach(f => { if (f && f.t && !have.has(f.t.toLowerCase())) mem.facts.push({ id: f.id || uid(), t: f.t }); });
        mem.facts = mem.facts.slice(-60); mem.base = r.updated; return memPush(true);
      }
      mem.base = r.updated; mem.dirty = false; mem.sync = 'ok'; mem.err = ''; memSave();
    } catch (e) { mem.sync = 'err'; mem.err = e.message; }
    memPaint();
  }
  function memAdd(t) {
    t = String(t || '').replace(/\s+/g, ' ').trim().slice(0, 240);
    if (!mem.user || t.length < 3) return false;
    if (mem.facts.some(f => f.t.toLowerCase() === t.toLowerCase())) return false;
    mem.facts.push({ id: uid(), t }); mem.facts = mem.facts.slice(-60); mem.dirty = true; memSave(); memSched(); memPaint(); return true;
  }
  function memCommand(text) {                                        // "ricorda che …" salva subito, senza chiamate extra
    const m = /^\s*(?:ricorda(?:ti)?|memorizza|tieni a mente)\s+(?:che\s+)?([\s\S]{3,300})$/i.exec(text || '');
    if (m && memAdd(m[1].split(/[.!?\n]/)[0])) toast('Salvato in memoria');
  }
  function memBlock() {
    if (!mem.user || !mem.facts.length) return '';
    return '\n\n[MEMORIA DI ' + mem.user + ': cose che l\'utente ti ha chiesto di ricordare o che hai imparato su di lui. Usale quando servono, senza citarle se non sono pertinenti.]\n' + mem.facts.map(f => '- ' + f.t).join('\n');
  }
  async function learn(entry, key, q, a) {
    if (!config.mem_auto || !mem.user || !q || !a) return;
    const raw = await llm(entry, key, [{ role: 'system', content: 'Estrai dalla conversazione solo fatti stabili e utili da ricordare sull\'utente (nome, classe, preferenze, progetti, abitudini). Ignora le richieste una tantum. Rispondi SOLO con un array JSON di stringhe brevi in italiano (massimo 3), oppure [] se non c\'è nulla da ricordare.' },
      { role: 'user', content: 'Utente: ' + q.slice(0, 1500) + '\nAssistente: ' + C.stripThink(a).slice(0, 1500) }]);
    const i = raw.indexOf('['), z = raw.lastIndexOf(']'); if (i < 0 || z <= i) return;
    let arr; try { arr = JSON.parse(raw.slice(i, z + 1)); } catch (e) { return; }
    if (Array.isArray(arr)) arr.slice(0, 3).forEach(x => { if (typeof x === 'string') memAdd(x); });
  }
  function renderMem() {
    const u = mem.user, chip = ({ ok: ['sincronizzata', 'ok'], busy: ['sincronizzo…', ''], err: ['errore', ''], off: ['solo locale', ''] })[mem.sync] || ['', ''];
    const keep = ($('#mmIn') || {}).value || '';
    let h = '';
    if (!u) h += noteH('warn', EMBED ? 'Scegli il tuo nome nel registro dell\'HUB: la memoria è personale.' : 'Imposta il tuo nome in Impostazioni: la memoria è personale.');
    else {
      h += `<div class="row" style="cursor:default;margin-top:6px"><span class="av" style="background:${color(u)}">${esc(u[0].toUpperCase())}</span><div class="t"><b>${esc(u)}</b><small>${mem.facts.length} ricordi</small></div><span class="ks ${chip[1]}">${chip[0]}</span></div>`;
      if (mem.sync === 'err') h += noteH('err', 'Sincronizzazione non riuscita: ' + mem.err);
      if (!syncUrl()) h += noteH('warn', 'La sincronizzazione con Sheets non è attiva: i ricordi restano solo su questo dispositivo.');
      h += `<div class="sec">Aggiungi un ricordo</div><input class="inp" id="mmIn" maxlength="240" placeholder="Es. Sono in 1 CIT, preferisco spiegazioni brevi"><button class="btn pri" id="mmAdd">Aggiungi</button>`;
      h += `<div class="sec">Cosa ricorda GPT CORE</div>` + (mem.facts.length
        ? mem.facts.map(f => `<div class="row" style="cursor:default"><div class="t"><b style="white-space:normal;font-weight:500">${esc(f.t)}</b></div><button class="mini" data-mdel="${esc(f.id)}" title="Elimina">${I.trash}</button></div>`).join('')
        : '<div class="card" style="font-size:13px;color:var(--muted);line-height:1.55">Ancora nulla. Scrivi in chat «ricorda che…» oppure aggiungi un ricordo qui sopra.</div>');
      h += `<div class="sw" style="margin-top:14px"><span style="font-size:14px">Impara automaticamente dalle chat</span><input id="mmAuto" type="checkbox" ${config.mem_auto ? 'checked' : ''}></div><div class="hint">Se attivo, dopo ogni risposta il modello salva da solo i fatti utili (una chiamata in più).</div>`;
      h += `<button class="btn" id="mmSync">Sincronizza ora</button><button class="btn dng" id="mmClear">Cancella la mia memoria</button>`;
      h += `<div class="hint" style="margin-top:12px">I ricordi sono salvati in un foglio Google (Sheets), una riga per utente, e seguono il tuo nome su ogni dispositivo.</div>`;
    }
    $('#memBody').innerHTML = h;
    if (!u) return;
    const inpEl = $('#mmIn'); inpEl.value = keep;
    const add = () => { if (memAdd(inpEl.value)) inpEl.value = ''; else if (inpEl.value.trim()) toast('Già presente o troppo corto'); };
    $('#mmAdd').onclick = add; inpEl.onkeydown = e => { if (e.key === 'Enter') add(); };
    $('#mmAuto').onchange = e => { config.mem_auto = e.target.checked; saveCfg(); };
    $('#mmSync').onclick = () => { if (!syncUrl()) return toast('Sincronizzazione non attiva'); memPull(); };
    $('#mmClear').onclick = async () => { if (await ask('Cancellare la memoria?', 'Tutti i ricordi di ' + u + ' verranno eliminati, anche da Sheets.', 'Cancella', true)) { mem.facts = []; mem.dirty = true; memSave(); memSched(); renderMem(); } };
    $$('[data-mdel]', $('#memBody')).forEach(b => b.onclick = () => { mem.facts = mem.facts.filter(f => f.id !== b.dataset.mdel); mem.dirty = true; memSave(); memSched(); renderMem(); });
  }

  // ============================================================ ACCOUNT: CONFIG CONDIVISA + CHAT PERSONALI (Sheets via Apps Script)
  // - modelli, chiavi API, Synapse/Presenton e ricerca web sono UNICI per tutta la classe (li modifica solo l'admin)
  // - chat, memoria e cronologia mail sono PERSONALI: ogni account ha le sue, sincronizzate su Sheets
  const isAdm = () => !EMBED || hubAdmin;
  const SH_KEYS = ['api_keys', 'api_models', 'brave_key', 'cors_proxy', 'web_search', 'web_max_rounds', 'web_results', 'web_pages', 'web_page_chars', 'synapse'];
  const sharedOf = () => { const o = {}; SH_KEYS.forEach(k => { if (config[k] !== undefined) o[k] = config[k]; }); return o; };
  const sh = { base: 0, last: '', t: 0, busy: false, loaded: false };
  const hasShared = o => !!(o && ((o.api_models && Object.keys(o.api_models).length) || (o.api_keys && Object.keys(o.api_keys).length)));

  function applyShared(s, updated) {
    SH_KEYS.forEach(k => { if (s && s[k] !== undefined) config[k] = s[k]; });
    config.api_keys = config.api_keys || {}; config.api_models = config.api_models || {};
    config.synapse = Object.assign({}, SYN_DEF, config.synapse || {});
    sh.base = updated || 0; sh.last = JSON.stringify(sharedOf());
    jset(KEY.cfg, persist()); renderPill();
    if ($('#scrStore').classList.contains('open') && (S.view === 'home' || S.view === 'syn')) renderStore();
  }
  function wipeShared() {                                           // al logout la copia locale delle chiavi non resta sul dispositivo
    config.api_keys = {}; config.api_models = {}; config.brave_key = ''; config.synapse = Object.assign({}, SYN_DEF);
    sh.loaded = false; sh.base = 0; sh.last = ''; jset(KEY.cfg, persist()); renderPill();
  }
  function shSched() {
    if (!EMBED || !hubAdmin || !hubToken || !sh.loaded) return;
    if (JSON.stringify(sharedOf()) === sh.last) return;
    clearTimeout(sh.t); sh.t = setTimeout(shPush, 800);
  }
  async function shPush() {
    if (!EMBED || !hubAdmin || !hubToken || sh.busy) return;
    sh.busy = true;
    try {
      const snap = sharedOf(), r = await gas({ action: 'cfg_set', shared: snap, base: sh.base }, 45000);
      if (r.conflict) { applyShared(r.shared, r.updated); toast('Config aggiornata da un altro dispositivo'); }
      else { sh.base = r.updated; sh.last = JSON.stringify(snap); }
    } catch (e) { toast('Config condivisa non salvata: ' + e.message); }
    sh.busy = false;
  }
  async function cfgPull() {
    if (!EMBED || !hubToken || !syncUrl()) return;
    try {
      const r = await gas({ action: 'cfg_get' }, 45000);
      if (r.found && r.shared) applyShared(r.shared, r.updated);
      else if (hubAdmin && hasShared(sharedOf())) { sh.loaded = true; sh.base = 0; await shPush(); toast('Config caricata per tutta la classe'); }
      sh.loaded = true;
    } catch (e) { /* offline: restano i valori locali */ }
  }

  // ---- chat personali: stesso schema della memoria (versione + unione in caso di conflitto)
  const chReplacer = (k, v) => (k === 'thumbs' || k === 'aurls') ? undefined : v;
  const chSig = list => JSON.stringify(list.map(c => [c.id, c.ts]));
  function chDoc() {
    let list = chats.slice(0, 60); const doc = { chats: list, del: CH.del.slice(-200) };
    while (list.length > 1 && JSON.stringify(doc, chReplacer).length > 750000) { list = list.slice(0, -1); doc.chats = list; }
    return JSON.parse(JSON.stringify(doc, chReplacer));
  }
  function chMerge(remote) {
    const del = new Set([...CH.del, ...((remote && remote.del) || [])]), map = new Map();
    [...((remote && remote.chats) || []), ...chats].forEach(c => {
      if (!c || !c.id || del.has(c.id)) return;
      const o = map.get(c.id);
      if (!o || (c.ts || 0) >= (o.ts || 0)) map.set(c.id, c);
    });
    chats = [...map.values()].sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, 60);
    CH.del = [...del].slice(-200);
  }
  function chSched() { clearTimeout(CH.t); CH.t = setTimeout(() => chPush(), 2500); }
  const chReady = () => !!mem.user && !!syncUrl() && (!EMBED || !!hubToken);
  async function chPull() {
    if (!chReady() || CH.pulling || busy) return;
    CH.pulling = true;
    try {
      const r = await gas({ action: 'chat_get' }, 60000), before = chSig(chats);
      if (r.found && r.doc) {
        chMerge(r.doc); CH.base = r.updated; jset(KEY.chats, chats);
        if (chSig(r.doc.chats || []) !== chSig(chats)) CH.dirty = true;
      } else if (chats.length) CH.dirty = true;
      chMetaSave(); CH.sync = 'ok';
      if (chSig(chats) !== before) { if (curId && !curChat()) curId = null; renderChat(); renderRecents(); }
    } catch (e) { CH.sync = 'err'; }
    CH.pulling = false;
    if (CH.dirty) chPush();
  }
  async function chPush(retry) {
    if (!chReady() || CH.pushing) return;
    CH.pushing = true; CH.sync = 'busy'; const seq = CH.seq;
    try {
      const r = await gas({ action: 'chat_set', doc: chDoc(), base: CH.base }, 90000);
      if (r.conflict) {
        chMerge(r.doc); CH.base = r.updated; jset(KEY.chats, chats); CH.pushing = false;
        if (!retry) return chPush(true);
        CH.sync = 'err'; return;
      }
      CH.base = r.updated; if (seq === CH.seq) CH.dirty = false; CH.sync = 'ok'; chMetaSave();
    } catch (e) { CH.sync = 'err'; }
    CH.pushing = false;
  }

  // cambio utente: carica le chat di quell'account (e la config condivisa), senza mescolarle con quelle degli altri
  let curUser = null;
  function userSwitch() {
    const u = memUser();
    if (u !== curUser) {
      curUser = u;
      if (u && jget(KEY.chats, null) === null && isAdm()) {          // prima volta: l'admin eredita le chat salvate prima dell'introduzione degli account
        const oc = jget('gptcore.chats', null), om = jget('gptcore.mail', null);
        if (Array.isArray(oc)) { jset(KEY.chats, oc); CH.dirty = true; }
        if (Array.isArray(om)) jset(KEY.mail, om);
        ['gptcore.chats', 'gptcore.mail', 'gptcore.cur'].forEach(k => { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } });
      }
      chats = jget(KEY.chats, []); if (!Array.isArray(chats)) chats = [];
      const m = jget(KEY.cmeta, {}) || {};
      CH.del = Array.isArray(m.del) ? m.del : []; CH.base = m.base || 0; CH.dirty = !!m.dirty || (u && chats.length && !m.base); CH.sync = 'off';
      mailHist = jget(KEY.mail, []);
      const last = jget(KEY.cur, null); curId = (last && chats.some(c => c.id === last)) ? last : null;
      pending = []; renderChips(); renderChat(); renderRecents();
    }
    cfgPull(); memSwitch(); chPull();
  }

  // ============================================================ AVVIO
  const givenName = s => { const p = String(s || '').trim().split(/\s+/).filter(Boolean); return p.length > 1 ? p.slice(1).join(' ') : (p[0] || ''); };   // il registro e' "Cognome Nome"
  function applyName() {
    const n = EMBED ? givenName(hubName) : (config.user_name || 'Flubatir');
    $('#heroName').textContent = n; $('#heroComma').classList.toggle('hidden', !n);
    $('#hubPick').classList.toggle('hidden', !EMBED || !!n);
    $('#avatarL').textContent = (n || '?')[0].toUpperCase();
  }
  const toHub = m => { try { window.parent.postMessage(Object.assign({ gc: 1 }, m), '*'); } catch (e) { /* ignore */ } };
  if (EMBED) {
    show($('#btnClose'), true); $('#btnClose').onclick = () => toHub({ type: 'close' }); $('#hubPick').onclick = () => toHub({ type: 'pick' });
    addEventListener('message', ev => {
      if (ev.source !== window.parent || !ev.data || ev.data.gc !== 1) return;
      if (ev.data.type === 'session') {
        const wasIn = !!hubToken;
        hubName = String(ev.data.name || ''); hubAdmin = !!ev.data.admin; hubToken = String(ev.data.token || ''); hubSync = String(ev.data.syncUrl || '');
        if (!hubToken && wasIn && sh.loaded) wipeShared();
        applyName(); userSwitch();
      }
      /* (la config condivisa arriva da Sheets dopo l'accesso) */
      if (ev.data.type === 'hidden' && rec) rec.stop();
    });
  }
  applyName(); renderPill(); syncBtn(); userSwitch();
  setInterval(() => { if (EMBED && hubToken && !busy && !document.hidden) chPull(); }, 60000);
  if (EMBED) toHub({ type: 'ready' });
  const last = jget(KEY.cur, null);
  if (last && chats.some(c => c.id === last)) { curId = last; renderChat(); }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.Capacitor && !EMBED) navigator.serviceWorker.register('sw.js').catch(() => { });
})();

</script>
</body>
